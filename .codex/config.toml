# Playwright MCP is optional for interactive investigation. Standard E2E uses
# the project-local Playwright CLI. No credentials belong in this file.
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
enabled = false

[mcp_servers.aispace_sources]
command = "uv"
args = ["run", "python", "server.py"]
cwd = "mcp/aispace_sources"
enabled = true
