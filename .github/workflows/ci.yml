name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Verify lock and install dependencies
        working-directory: backend
        run: |
          uv lock --check
          uv sync --frozen
      - name: Format, lint, and type check
        working-directory: backend
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run pyright
      - name: Test with real PostgreSQL containers
        working-directory: backend
        run: uv run pytest
      - name: Build backend package
        working-directory: backend
        run: uv build

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, type check, test, and build
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build

  runtime-e2e:
    name: Clean Compose runtime and browser journeys
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEEPSEEK_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start clean application
        run: |
          docker compose down -v --remove-orphans
          docker compose up --build -d
      - name: Wait for public readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health/ready; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify services and one-shot jobs
        run: |
          docker compose ps --all
          migrate_id="$(docker compose ps --all -q migrate)"
          seed_id="$(docker compose ps --all -q seed)"
          if [ -z "$migrate_id" ]; then
            echo "::error::migrate container was not found"
            exit 1
          fi
          if [ -z "$seed_id" ]; then
            echo "::error::seed container was not found"
            exit 1
          fi
          migrate_exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$migrate_id")"
          seed_exit_code="$(docker inspect -f '{{.State.ExitCode}}' "$seed_id")"
          if [ "$migrate_exit_code" != "0" ]; then
            echo "::error::migrate exited with code $migrate_exit_code"
            exit 1
          fi
          if [ "$seed_exit_code" != "0" ]; then
            echo "::error::seed exited with code $seed_exit_code"
            exit 1
          fi
          curl --fail http://127.0.0.1:8080/api/v1/health/live
          curl --fail http://127.0.0.1:8080/api/v1/health/ready
      - name: Replay migrations and seed
        run: |
          docker compose run --rm migrate
          docker compose run --rm seed
          room_counts="$(docker compose exec -T postgres psql -U aispace -d aispace -tAc "SELECT count(*), count(*) FILTER (WHERE name IN ('Большая переговорная', 'Средняя переговорная', 'Малая переговорная')) FROM rooms;" | tr -d '[:space:]')"
          test "$room_counts" = "3|3"
      - name: Run browser journeys
        working-directory: e2e
        run: npx playwright test
      - name: Collect Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down runtime
        if: always()
        run: docker compose down -v --remove-orphans
